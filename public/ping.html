<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>بُردین — تست اتصال</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #fff;
        font-family: Tahoma, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        border: 1px solid rgba(255, 161, 0, 0.35);
        border-radius: 20px;
        padding: 28px 20px;
        background: rgba(255, 255, 255, 0.04);
      }
      h1 {
        margin: 0 0 12px;
        color: #ffa100;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 18px;
        line-height: 1.8;
        color: rgba(255, 255, 255, 0.75);
        font-size: 0.95rem;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #ffa100;
        color: #000;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>اتصال برقرار است</h1>
      <p>اگر این صفحه را می‌بینید، دامنه bordin.ir از شبکه شما در دسترس است.</p>
      <a href="/">ورود به صفحه اصلی بُردین</a>
    </div>
  </body>
</html>
