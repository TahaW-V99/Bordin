name = "bordin-kandakator-sync"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# هر ۲۰ دقیقه — مثل گیت‌هاب
[triggers]
crons = ["*/20 * * * *"]

# احراز هویت (یکی از دو روش):
# 1) API Token (پیشنهادی — بدون مرورگر، مخصوصاً اگر login خطا می‌دهد):
#    dash.cloudflare.com → My Profile → API Tokens → Create Token
#    → Template: "Edit Cloudflare Workers"
#    PowerShell:
#      $env:CLOUDFLARE_API_TOKEN="توکن_شما"
#      npm run cf:worker:deploy
# 2) wrangler login — اگر مرورگر خطا داد:
#      npm run cf:worker:login:no-browser
#
# Secrets ورکر (بعد از deploy):
# FOOTBALL_DATA_API_KEY
# KANDAKATOR_SYNC_PUSH_TOKEN
# BORDIN_PUSH_URLS  (مثلاً https://bordintest.ir,https://bordin.ir)
